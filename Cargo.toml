[workspace]
members = [
  "crates/rsclip-core",
  "crates/rsclip-daemon",
  "crates/rsclip-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
gio = "0.21"
gdk-pixbuf = "0.21"
glib = "0.21"
gtk4 = { version = "0.10", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.7", features = ["v1_3"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "gzip"] }
image = { version = "0.25.10", default-features = false, features = ["ico", "png", "jpeg", "webp"] }
scraper = "0.27.0"
