[package]
name = "rsclip-ui"
version = "0.1.25"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rsclip"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rsclip-core = { path = "../rsclip-core" }
gdk-pixbuf.workspace = true
gio.workspace = true
glib.workspace = true
gtk4.workspace = true
gtk4-layer-shell.workspace = true
sourceview5.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rusqlite.workspace = true


# Drives the real window on a private headless compositor. Runs without the
# libtest harness so the UI modules it includes via #[path] don't bring their
# unit tests along (GTK may only be initialized from one thread).
[[test]]
name = "headless_ui_perf"
harness = false
