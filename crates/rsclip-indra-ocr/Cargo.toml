[package]
name = "rsclip-indra-ocr"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Python-free Indra OCR inference using ONNX Runtime"

[[bin]]
name = "rsclip-ocr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
directories.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }
